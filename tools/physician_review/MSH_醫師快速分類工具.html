<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MSH 醫師影像檢閱工作台</title>
<style>
:root{--bg:#040611;--panel:#0c1024;--panel2:#111837;--line:#29345c;--text:#f2f6ff;--muted:#9faed0;--cyan:#00e6ff;--blue:#2384ff;--violet:#9b4dff;--pink:#f03cff;--green:#40e6a1;--amber:#ffc14d;--danger:#ff6b89}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0%,#122763 0,transparent 30%),radial-gradient(circle at 90% 8%,#311265 0,transparent 28%),var(--bg);color:var(--text);font-family:"Microsoft JhengHei",system-ui,sans-serif}.app{max-width:1280px;margin:auto;padding:24px}.shell{border:1px solid var(--line);background:linear-gradient(145deg,rgba(13,18,42,.96),rgba(5,7,19,.96));box-shadow:0 0 40px rgba(30,117,255,.18),inset 0 0 32px rgba(91,43,195,.12);overflow:hidden}.top{min-height:132px;display:flex;align-items:center;gap:20px;padding:18px 24px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,rgba(7,15,38,.96),rgba(13,8,34,.82))}.brand-art{width:148px;height:84px;object-fit:cover;object-position:center;border:1px solid rgba(0,230,255,.45);box-shadow:0 0 18px rgba(0,230,255,.35)}.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--cyan);font-weight:700}.top h1{margin:4px 0 6px;font-size:27px;letter-spacing:.04em}.top p{margin:0;color:var(--muted)}.session{margin-left:auto;min-width:184px;border:1px solid rgba(155,77,255,.6);padding:12px 14px;background:rgba(55,24,94,.26)}.session span{display:block;font-size:12px;color:#d5bcff}.session strong{display:block;margin-top:5px;color:var(--cyan);font-variant-numeric:tabular-nums}.content{padding:22px}.panel{border:1px solid var(--line);background:linear-gradient(160deg,rgba(17,24,55,.85),rgba(7,10,28,.86));padding:16px;margin-bottom:16px}.panel-title{margin:0 0 12px;color:var(--cyan);font-size:13px;letter-spacing:.12em}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.field{display:grid;gap:6px;color:var(--muted);font-size:13px}.field input{min-width:220px;background:#060918;border:1px solid #35446e;color:var(--text);padding:10px 12px;font:inherit;outline:none}.field input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,230,255,.13)}button,.file{border:1px solid #3d4d7b;background:#121a39;color:var(--text);padding:10px 13px;font:inherit;cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s}button:hover,.file:hover{transform:translateY(-1px);border-color:var(--cyan);box-shadow:0 0 15px rgba(0,230,255,.2)}button:focus-visible,.file:focus-within{outline:2px solid var(--cyan);outline-offset:2px}.file input{display:none}.primary{background:linear-gradient(90deg,#0868bd,#7440db);border-color:var(--cyan);box-shadow:0 0 18px rgba(37,132,255,.25)}.secondary{background:#0d1430}.danger{border-color:rgba(255,107,137,.65)}.view-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.hint{color:var(--muted);font-size:13px}.progress-row{display:flex;gap:12px;align-items:center;margin:16px 0 10px}.progress{height:7px;flex:1;background:#050713;overflow:hidden;border:1px solid #20294b}.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink));box-shadow:0 0 12px var(--cyan);transition:width .2s}.status{font-size:13px;color:var(--muted);min-height:38px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-left:3px solid var(--cyan);padding:8px 10px;background:rgba(4,8,25,.7)}#message{color:var(--cyan);font-weight:700}.viewer{position:relative;min-height:570px;overflow:hidden;touch-action:none;border:1px solid #31416b;background-color:#030611;background-image:linear-gradient(rgba(17,67,113,.19) 1px,transparent 1px),linear-gradient(90deg,rgba(17,67,113,.19) 1px,transparent 1px);background-size:28px 28px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 35px rgba(0,0,0,.7)}.viewer:before{content:"MSH • IMAGE REVIEW SURFACE";position:absolute;top:10px;left:12px;z-index:2;color:rgba(0,230,255,.55);font-size:11px;letter-spacing:.16em}.viewer img{position:absolute;max-width:none;max-height:none;transform-origin:0 0;cursor:grab;user-select:none;-webkit-user-drag:none;box-shadow:0 0 28px rgba(0,0,0,.75)}.viewer img.dragging{cursor:grabbing}.placeholder{color:var(--muted);text-align:center}.hidden{display:none}.classify{margin-top:18px}.classify h2{font-size:14px;margin:0 0 10px;color:var(--cyan);letter-spacing:.1em}.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:9px}.category{text-align:left;min-height:48px;background:#101936;border-color:#344978}.category .key{float:right;color:#b9c7eb;font-size:12px}.category.core{border-left:3px solid var(--cyan)}.category.subtype{border-left:3px solid var(--violet)}.category.review{border-left:3px solid var(--amber)}.category.warning{border-left:3px solid var(--danger)}.category.selected{background:linear-gradient(90deg,rgba(0,230,255,.25),rgba(155,77,255,.25));border-color:var(--cyan);box-shadow:0 0 18px rgba(0,230,255,.2)}.footer{display:flex;justify-content:space-between;gap:16px;padding:16px 22px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.footer b{color:var(--cyan)}@media(max-width:720px){.app{padding:0}.shell{border:0}.top{padding:16px;align-items:flex-start}.brand-art{width:96px;height:70px}.top h1{font-size:21px}.session{display:none}.content{padding:14px}.viewer{min-height:430px}.actions{grid-template-columns:repeat(2,minmax(0,1fr))}.footer{display:block}.footer p{margin:6px 0}}

/* Both image and overlay start at the same explicit origin; avoid flex static-position centering. */
.viewer img,#overlay{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;max-height:none}
#overlay{overflow:visible;pointer-events:none;z-index:1}
.viewer.drawing #overlay{pointer-events:auto;cursor:crosshair}
.viewer:before{pointer-events:none}
.viewer img.hidden,#overlay.hidden{display:none}
.field select,.field textarea{background:#060918;border:1px solid #35446e;color:var(--text);padding:10px;font:inherit;max-width:100%}
.controls .field{min-width:0;flex:1 1 220px}
.field select{width:100%;min-width:180px}.notes-field{flex-grow:2}.warning-text{color:var(--amber)}
.status{align-items:flex-start;flex-wrap:wrap}#message{overflow-wrap:anywhere}
.review-navigation{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px;padding:12px;border:1px solid var(--line);background:rgba(7,10,28,.86)}
.review-navigation #undo{margin-left:auto}
.target-controls{margin-bottom:10px}.target-controls #deleteBox{align-self:end}
.classification-heading{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:12px}.classification-heading h2{margin:0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.target-chip{display:inline-block;padding:5px 9px;border:1px solid var(--cyan);color:var(--cyan);font-size:12px;letter-spacing:0}.target-chip[data-kind="box"]{border-color:var(--amber);color:var(--amber)}
.box-toggle{white-space:nowrap}.box-toggle[aria-pressed="true"]{border-color:var(--amber);color:var(--amber);background:rgba(255,193,77,.09)}#actions #classify{min-width:90px}.auto-next{display:block;margin:10px 0;font-size:13px;color:var(--muted)}.auto-next.hidden{display:none}.shortcut-help{margin-top:14px;color:var(--muted);font-size:12px}.shortcut-help summary{cursor:pointer;width:max-content}.shortcut-help p{line-height:1.8}
.drawing-hint{position:absolute;top:34px;left:12px;z-index:3;padding:7px 10px;background:rgba(7,10,28,.95);border:1px solid var(--amber);color:var(--amber);font-size:13px;pointer-events:none}.drawing-hint.hidden{display:none}
@media(max-width:520px){#actions .field{flex-basis:100%}.target-controls .field{flex-basis:100%}}
</style>
</head>

<details class="shortcut-help"><summary>快捷鍵</summary><p>Enter 儲存 · ←／→ 換圖 · S 略過 · Ctrl+Z 復原<br>1–8 選形態 · Delete 刪框 · Esc 結束框選</p></details>
<p id="statistics" class="hint" aria-label="分類統計"></p></section>
</div><footer class="footer"><p><b>MSH</b> 圖片保持原樣。</p><p>進度請另存 JSON 備份。</p></footer>
</section></main>
<script>
// The taxonomy below is the sole definition used by UI, validation and exports.
const CLASSIFICATION = [
 {code:'G',label:'GRANULOCYTIC (MYELOID) CELLS',children:[
  ['G01','Eosinophil, any stage'],['G02','Basophil, any stage'],['G03','Monocyte'],
  ['G04','Monocyte, immature (promonocyte or monoblast)'],['G05','Segmented or band form neutrophil'],
  ['G06','Metamyelocyte, Neutrophilic'],['G07','Myelocyte, Neutrophilic'],['G08','Promyelocyte'],
  ['G09','Blast'],['G10','Myeloblast/Promyelocyte with Auer rod(s)'],['G11','Neutrophil with Pelger-Huet nucleus'],
  ['G12','Segmented neutrophil, with hypersegmented nucleus'],['G13','Segmented or band form neutrophil with toxic granulation']]},
 {code:'R',label:'ERYTHROCYTIC CELLS / INCLUSION BODIES',children:[
  ['R01','Acanthocyte (spur cell)'],['R02','Basophilic stippling (coarse)'],['R03','Echinocyte (burr cell, crenated red cell)'],
  ['R04','Erythrocyte, normal'],['R05','Fragmented red cell (schistocyte, helmet cell, keratocyte)'],['R06','Bite cell'],
  ['R07','Howell-Jolly body'],['R08','Macrocyte oval or round (excluding polychromatophilic red cells)'],
  ['R09','Microcyte (with central pallor)'],['R10','Nucleated red cell'],['R11','Ovalocyte (elliptocyte)'],
  ['R12','Pappenheimer bodies, presumptive'],['R13','Polychromatophilic RBC'],['R14','Red cell agglutination'],
  ['R15','Rouleaux formation'],['R16','Spherocyte'],['R17','Stomatocyte'],['R18','Target cell (codocyte)'],['R19','Teardrop cell (dacrocyte)']]},
 {code:'P',label:'MEGAKARYOCYTIC CELLS / THROMBOCYTES (PLATELETS)',children:[
  ['P01','Megakaryocyte nucleus'],['P02','Megakaryocyte or precursor'],['P03','Platelet, normal'],
  ['P04','Giant platelet (macrothrombocyte)'],['P05','Platelet satellitism'],['P06','Platelet clump'],['P07','Platelet, bizarre shape']]},
 {code:'L',label:'LYMPHOCYTIC / PLASMACYTIC CELLS',children:[
  ['L01','Lymphocyte'],['L02','Large granular lymphocyte'],['L03','Reactive lymphocyte (atypical lymphocyte)'],
  ['L04','Plasma cell'],['L05','Lymphoma cell (malignant), includes Hairy cell and Sezary cell'],
  ['L06','Lymphoblast'],['L07','Prolymphocyte'],['L08','Abnormal lymphoid cell']]},
 {code:'M',label:'MICROORGANISMS',children:[
  ['M01','Babesia'],['M02','Bacteria (cocci or rod), extracellular'],['M03','Fungi, extracellular'],
  ['M04','Leukocyte with phagocytized bacteria'],['M05','Leukocyte with phagocytized fungi'],
  ['M06','Malaria'],['M07','Microfilaria'],['M08','Protozoan (non-malarial)']]},
 {code:'A',label:'ARTIFACTS',children:[
  ['A01','Basket cell/smudge cell'],['A02','Erythrocyte with overlying platelet'],
  ['A03','Neutrophil necrobiosis (degenerated neutrophil)'],['A04','RBC ghost'],['A05','Stain precipitate'],['A06','Mitotic cell']]}
].map(parent=>({...parent,children:parent.children.map(([code,label])=>({code,label}))}));
const classes = new Map(CLASSIFICATION.flatMap(p=>p.children.map(c=>[c.code,{parentCode:p.code,parentLabel:p.label,classCode:c.code,classLabel:c.label}])));
const valid=/\.(jpg|jpeg|png|bmp|tif|tiff|webp)$/i;
const reviewStates=['unreviewed','reviewed','confirmed'];
const SVG_NS='http://www.w3.org/2000/svg';
const storagePrefix='msh-physician-morphology-v2:';
const byId=id=>document.getElementById(id);
const el=Object.fromEntries(['reviewer','batch','folder','viewer','image','placeholder','status','message','previous','undo','skip','next','save','saveJson','restore','zoomIn','zoomOut','fit','original','progressFill','progressText','sessionLabel','parent','child','classify','autoNext','mode','boxes','boxPicker','targetHint','deleteBox','startBox','newBox','drawHint','autoNextLabel','overlay','loadSummary','imageList','statistics','legacyStatus'].map(id=>[id,byId(id)]));
let files=[],index=0,records=new Map(),history=[],currentUrl=null,scale=1,x=0,y=0;
let draftClassification=null,selectedId=null,gesture=null,loading=false,storageKey='',legacyRecords=[],unmatchedRecords=[],pendingImport=null;
let datasetGeneration=0,showGeneration=0,sourceRoot='',saveTimer=null,fitMode=true,autoSaveAllowed=true;
const clone=value=>JSON.parse(JSON.stringify(value));
const say=message=>{el.message.textContent=message};
const current=()=>files[index] ? records.get(files[index].relativePath) : null;
function classValue(parent,child) {
 const value=classes.get(child);
 return value && value.parentCode===parent ? {...value} : null;
}
function isClass(value) { return value && !!classValue(value.parentCode,value.classCode); }
function timestamp(record) {
 record.annotationTimestamp=new Date().toISOString(); record.annotator=el.reviewer.value.trim();
}
function populateParents(select) {
 select.replaceChildren(new Option('選擇類別',''));
 for(const parent of CLASSIFICATION)select.add(new Option(`${parent.code} — ${parent.label}`,parent.code));
}
function populateChildren(parent,select,value='') {
 const definition=CLASSIFICATION.find(p=>p.code===parent);
 select.replaceChildren(new Option(definition?'選擇形態':'先選類別',''));
 select.disabled=!definition;
 if(definition)for(const child of definition.children)select.add(new Option(`${child.code} — ${child.label}`,child.code));
 select.value=value;
}
function relativePath(file) {
 const path=(file.webkitRelativePath||file.name).replaceAll('\\','/');
 return sourceRoot && path.startsWith(sourceRoot+'/') ? path.slice(sourceRoot.length+1) : path;
}
function naturalSort(a,b) {
 return a.relativePath.localeCompare(b.relativePath,undefined,{numeric:true,sensitivity:'base'}) || a.relativePath.localeCompare(b.relativePath);
}
async function sha256(file) {
 if(!globalThis.crypto?.subtle)return '';
 const digest=await crypto.subtle.digest('SHA-256',await file.arrayBuffer());
 return Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,'0')).join('');
}
function dimensions(file) {
 return new Promise((resolve,reject)=>{
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{const size={imageWidth:img.naturalWidth,imageHeight:img.naturalHeight};URL.revokeObjectURL(url);resolve(size)};
  img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('無法解碼；TIFF/TIF 需瀏覽器本身支援，未加入 decoder'))};
  img.src=url;
 });
}
function newRecord(entry) {
 return {fileName:entry.file.name,relativePath:entry.relativePath,sha256:'',imageWidth:0,imageHeight:0,
  imageClassification:null,annotations:[],reviewStatus:'unreviewed',notes:'',annotator:'',annotationTimestamp:'',loadError:'',hashError:''};
}
function updateProgress() {
 const values=[...records.values()],total=files.length,done=values.filter(r=>isClass(r.imageClassification)).length;
 el.progressFill.style.width=total?`${done/total*100}%`:'0%';
 el.progressText.textContent=`${done} / ${total} 已分類 · ${total-done} 未分類`;
 el.sessionLabel.textContent=total?`${el.reviewer.value.trim()||'未命名'} · ${done}/${total}`:'等待選取資料夾';
 const good=values.filter(r=>r.imageWidth && !r.loadError).length,bad=values.filter(r=>r.loadError).length;
 el.loadSummary.textContent=`找到圖片：${total}　成功載入：${good}　失敗：${bad}${loading?'　正在讀取與計算 SHA-256…':''}`;
 const failures=values.filter(r=>r.loadError).map(r=>`${r.relativePath}：${r.loadError}`);
 el.loadSummary.title=failures.join('\n');
 el.statistics.textContent=CLASSIFICATION.map(p=>`${p.code}：${values.filter(r=>r.imageClassification?.parentCode===p.code).length}`).join('　')+`　框：${values.reduce((n,r)=>n+r.annotations.length,0)}`;
 el.save.disabled=el.saveJson.disabled=loading || !total;
 el.classify.disabled=loading || !current()?.imageWidth || (el.mode.value==='draw'&&!selectedId);
 el.mode.disabled=el.startBox.disabled=loading || !current()?.imageWidth;
 for(let i=0;i<el.imageList.options.length;i++){
  const r=values[i];el.imageList.options[i].textContent=`${r.loadError?'⚠':isClass(r.imageClassification)?'✓':'○'} ${r.relativePath}`;
 }
}
function updateControls() {
 const r=current();
 el.parent.value=r?.imageClassification?.parentCode||'';
 populateChildren(el.parent.value,el.child,r?.imageClassification?.classCode||'');
 const legacy=r?.legacyClassification;
 el.legacyStatus.textContent=legacy?`Legacy / Unmapped：${typeof legacy==='string'?legacy:JSON.stringify(legacy)}。請重新人工分類。`:'';
 el.imageList.value=String(index);
 renderBoxes();
}
function applyTransform() {
 const transform=`translate(${x}px,${y}px) scale(${scale})`;
 el.image.style.transform=transform;el.overlay.style.transform=transform;
 renderBoxes(false);
}
function fitImage() {
 const r=current();if(!r?.imageWidth)return;
 const width=el.viewer.clientWidth,height=el.viewer.clientHeight;
 scale=Math.min(width/r.imageWidth,height/r.imageHeight,1);
 x=(width-r.imageWidth*scale)/2;y=(height-r.imageHeight*scale)/2;
 fitMode=true;applyTransform();
}
function originalImage() {
 const r=current();if(!r?.imageWidth)return;
 scale=1;x=(el.viewer.clientWidth-r.imageWidth)/2;y=(el.viewer.clientHeight-r.imageHeight)/2;
 fitMode=false;applyTransform();
}
function zoomAt(next,clientX,clientY) {
 if(!current()?.imageWidth)return;
 next=Math.max(.005,Math.min(8,next));
 const rect=el.viewer.getBoundingClientRect();
 const mx=clientX===undefined?el.viewer.clientWidth/2:clientX-rect.left-el.viewer.clientLeft;
 const my=clientY===undefined?el.viewer.clientHeight/2:clientY-rect.top-el.viewer.clientTop;
 x=mx-(mx-x)/scale*next;y=my-(my-y)/scale*next;scale=next;fitMode=false;applyTransform();
}
function releasePreview() {
 el.image.onload=el.image.onerror=null;el.image.removeAttribute('src');
 if(currentUrl){URL.revokeObjectURL(currentUrl);currentUrl=null}
 el.image.classList.add('hidden');el.overlay.classList.add('hidden');
}
function show() {
 const generation=++showGeneration;releasePreview();selectedId=null;gesture=null;draftClassification=current()?.imageClassification||null;
 if(!files.length){el.placeholder.classList.remove('hidden');el.status.textContent='尚未選取可用圖片';updateProgress();return}
 index=Math.max(0,Math.min(index,files.length-1));
 const r=current(),entry=files[index];
 el.status.textContent=`${index+1} / ${files.length}　${r.relativePath}${r.imageClassification?'　'+r.imageClassification.classCode:''}`;
 updateControls();updateProgress();
 el.placeholder.classList.remove('hidden');el.placeholder.textContent=r.loadError?`${r.fileName}：${r.loadError}`:'正在顯示圖片…';
 if(r.loadError)return;
 currentUrl=URL.createObjectURL(entry.file);
 el.image.onload=()=>{
  if(generation!==showGeneration)return;
  r.imageWidth=el.image.naturalWidth;r.imageHeight=el.image.naturalHeight;
  el.overlay.setAttribute('width',r.imageWidth);el.overlay.setAttribute('height',r.imageHeight);
  el.overlay.setAttribute('viewBox',`0 0 ${r.imageWidth} ${r.imageHeight}`);
  el.image.classList.remove('hidden');el.overlay.classList.remove('hidden');el.placeholder.classList.add('hidden');
  fitImage();updateProgress();
 };
 el.image.onerror=()=>{
  if(generation!==showGeneration)return;
  r.loadError='預覽解碼失敗';el.placeholder.textContent=`${r.fileName}：${r.loadError}`;
  el.image.classList.add('hidden');el.overlay.classList.add('hidden');updateProgress();
 };
 el.image.src=currentUrl;
}
async function loadFiles(fileList) {
 clearTimeout(saveTimer);saveTimer=null;
 if(storageKey)persist();
 const generation=++datasetGeneration;loading=true;storageKey='';pendingImport=pendingImport||null;
 el.mode.value='browse';el.viewer.classList.remove('drawing');
 const input=Array.from(fileList);
 const roots=new Set(input.filter(f=>f.webkitRelativePath).map(f=>f.webkitRelativePath.replaceAll('\\','/').split('/')[0]));
 sourceRoot=roots.size===1?[...roots][0]:'';
 files=input.filter(f=>valid.test(f.name)||f.type.startsWith('image/')).map(file=>({file,relativePath:relativePath(file)})).sort(naturalSort);
 const seen=new Set(),duplicates=[];
 files=files.filter(entry=>{if(seen.has(entry.relativePath)){duplicates.push(entry.relativePath);return false}seen.add(entry.relativePath);return true});
 records=new Map(files.map(entry=>[entry.relativePath,newRecord(entry)]));history=[];legacyRecords=[];unmatchedRecords=[];index=0;
 el.imageList.replaceChildren(...files.map((f,i)=>new Option(f.relativePath,String(i))));show();
 say(duplicates.length?`重複 relativePath 已排除：${duplicates.join('、')}`:'載入中，請稍候；原始圖片不會被寫入。');
 for(const entry of files){
  if(generation!==datasetGeneration)return;
  const r=records.get(entry.relativePath);
  try{Object.assign(r,await dimensions(entry.file))}catch(error){r.loadError=error.message}
  try{r.sha256=await sha256(entry.file);if(!r.sha256)r.hashError='此瀏覽器沒有 Web Crypto SHA-256；匯出時會明確列出缺漏'}catch(error){r.hashError=`SHA-256 失敗：${error.message}`}
  if(generation!==datasetGeneration)return;
  updateProgress();await new Promise(resolve=>setTimeout(resolve,0));
 }
 if(generation!==datasetGeneration)return;
 // A dataset key includes raw-byte hashes, not just names, so old labels cannot silently follow replaced images.
 const signature=JSON.stringify(files.map(f=>{const r=records.get(f.relativePath);return [r.relativePath,r.sha256,f.file.size,r.sha256?'':f.file.lastModified]}));
 const datasetKey=await sha256(new File([signature],'dataset.json'))||signature;
 if(generation!==datasetGeneration)return;
 storageKey=storagePrefix+datasetKey;
 let saved=null,restoreWarning='';autoSaveAllowed=true;
 try{const value=localStorage.getItem(storageKey);if(value)saved=JSON.parse(value)}catch(error){
  autoSaveAllowed=false;restoreWarning=`本機恢復失敗：${error.message}；保留原本儲存內容，請使用 JSON 備份。`;
 }
 let importReport='';
 if(pendingImport){importReport=restoreData(pendingImport);pendingImport=null}
 else if(saved)importReport=restoreData(saved);
 loading=false;
 show();updateProgress();
 const failures=[...records.values()].filter(r=>r.loadError);
 const hashFailures=[...records.values()].filter(r=>r.hashError);
 say((importReport||`載入完成。${failures.length?'無法顯示：'+failures.map(r=>r.relativePath).join('、'):''}${hashFailures.length?' SHA-256 缺漏：'+hashFailures.length+' 張；請查看 JSON。':''}`)+restoreWarning);
 persist();
}
function snapshot() {
 return {schemaVersion:2,taxonomyVersion:'morphology-61-v1',reviewer:el.reviewer.value.trim(),batchName:el.batch.value.trim(),sourceRoot,currentPath:current()?.relativePath||'',
  images:[...records.values()].map(clone),legacyRecords:clone(legacyRecords),unmatchedRecords:clone(unmatchedRecords)};
}
function persist() {
 if(!storageKey||loading||!autoSaveAllowed)return;
 try{localStorage.setItem(storageKey,JSON.stringify(snapshot()))}
 catch(error){say(`自動儲存失敗：${error.message}。請立即備份 JSON；目前記錄仍在記憶體中。`)}
}
function schedulePersist(){clearTimeout(saveTimer);saveTimer=setTimeout(persist,250)}
function checkpoint() { if(current())history.push({index,path:current().relativePath,record:clone(current())}); }
function changed(syncClassification=false) {timestamp(current());updateProgress();renderBoxes(true,syncClassification);persist()}
function classify() {
 const r=current();if(!r||loading||r.loadError)return;
 const value=classValue(el.parent.value,el.child.value);
 if(!value){say('請選擇相符的細胞／物件類別與形態分類。');return}
 if(el.mode.value==='draw'){
  const box=r.annotations.find(a=>a.annotationId===selectedId);
  if(box){checkpoint();Object.assign(box,value);timestamp(box);changed();say(`框已儲存 · ${value.classCode}`)}
  else startBox();
  return;
 }
 checkpoint();r.imageClassification=value;changed();say(`已儲存 · ${value.classCode}`);
 if(el.autoNext.checked&&index<files.length-1){index++;show();schedulePersist()}
 else updateControls();
}
function undo() {
 if(loading)return;
 const action=history.pop();if(!action){say('尚無可復原的動作。');return}
 records.set(action.path,action.record);index=action.index;show();persist();say('已復原上一步。');
}
function navigate(delta) {if(loading||!files.length)return;el.mode.value='browse';el.viewer.classList.remove('drawing');index=Math.max(0,Math.min(files.length-1,index+delta));show();schedulePersist()}
function validateRecord(r) {
 const errors=[],ids=new Set();
 if(!r.relativePath||!r.fileName)errors.push('缺少原圖識別');
 if(r.imageClassification&&!isClass(r.imageClassification))errors.push('非法影像分類');
 if(!reviewStates.includes(r.reviewStatus))errors.push('非法 reviewStatus');
 for(const a of r.annotations){
  if(!a.annotationId||ids.has(a.annotationId))errors.push('annotationId 缺漏或重複');ids.add(a.annotationId);
  if(!isClass(a))errors.push('框的細胞／物件類別與形態分類不相符');
  if(!reviewStates.includes(a.reviewStatus))errors.push('非法框 reviewStatus');
  if(![a.xMin,a.yMin,a.xMax,a.yMax].every(Number.isFinite)||a.xMin<0||a.yMin<0||a.xMax>r.imageWidth||a.yMax>r.imageHeight||a.xMax<=a.xMin||a.yMax<=a.yMin)errors.push('框超出原圖或面積為零');
 }
 return errors;
}
function normalizeImported(r,actual) {
 const result={...clone(actual),imageClassification:null,annotations:[],notes:String(r.notes||''),reviewStatus:r.reviewStatus||'unreviewed',annotator:String(r.annotator||''),annotationTimestamp:String(r.annotationTimestamp||'')};
 if(r.imageClassification){
  const value=classValue(r.imageClassification.parentCode,r.imageClassification.classCode);
  if(!value)throw new Error('INVALID_CLASSIFICATION');result.imageClassification=value;
 }
 if(r.legacyClassification!==undefined)result.legacyClassification=clone(r.legacyClassification);
 if(r.annotations!==undefined&&!Array.isArray(r.annotations))throw new Error('INVALID_ANNOTATIONS');
 result.annotations=(r.annotations||[]).map(a=>{
  const value=classValue(a.parentCode,a.classCode);if(!value)throw new Error('INVALID_OBJECT_CLASS');
  return {annotationId:a.annotationId,...value,xMin:a.xMin,yMin:a.yMin,xMax:a.xMax,yMax:a.yMax,
   reviewStatus:a.reviewStatus||'unreviewed',annotator:String(a.annotator||''),annotationTimestamp:String(a.annotationTimestamp||'')};
 });
 const errors=validateRecord(result);if(errors.length)throw new Error(errors.join('；'));
 return result;
}
function restoreData(data) {
 const errors=[];let restored=0;
 if(data.schemaVersion===2){
  if(data.taxonomyVersion && data.taxonomyVersion!=='morphology-61-v1')throw new Error('不相容的 taxonomyVersion；未套用分類');
  if(!Array.isArray(data.images))throw new Error('JSON images 必須是陣列');
  const seen=new Set();
  for(const r of data.images){
   const actual=records.get(r.relativePath);
   if(seen.has(r.relativePath)){errors.push(`DUPLICATE_IMAGE_RECORD：${r.relativePath}`);unmatchedRecords.push({reason:'DUPLICATE_IMAGE_RECORD',record:clone(r)});continue}seen.add(r.relativePath);
   let reason='';
   if(!actual)reason='MISSING_IMAGE';
   else if(!r.sha256||!actual.sha256)reason='UNVERIFIED_HASH';
   else if(r.sha256!==actual.sha256)reason='HASH_MISMATCH';
   else if(r.imageWidth!==actual.imageWidth||r.imageHeight!==actual.imageHeight||r.fileName!==actual.fileName)reason='IMAGE_IDENTITY_MISMATCH';
   try{
    if(reason)throw new Error(reason);
    records.set(r.relativePath,normalizeImported(r,actual));restored++;
   }catch(error){errors.push(`${error.message}：${r.relativePath}`);unmatchedRecords.push({reason:error.message,record:clone(r)})}
  }
  if(data.reviewer&&!el.reviewer.value.trim())el.reviewer.value=data.reviewer;
  legacyRecords.push(...(Array.isArray(data.legacyRecords)?clone(data.legacyRecords):[]));
  unmatchedRecords.push(...(Array.isArray(data.unmatchedRecords)?clone(data.unmatchedRecords):[]));
  const last=files.findIndex(f=>f.relativePath===data.currentPath);if(last>=0)index=last;
 }else{
  const rows=Array.isArray(data)?data:Array.isArray(data.records)?data.records:Object.entries(data.records||data).map(([image_id,doctor_category])=>({image_id,doctor_category}));
  for(const r of rows){
   legacyRecords.push(clone(r));
   const name=r.image_id||r.fileName||r.file_name||r.filename;
   const matches=files.filter(f=>f.file.name===name);
   if(matches.length!==1){errors.push(`${matches.length?'AMBIGUOUS_FILENAME':'MISSING_IMAGE'}：${name||'未提供檔名'}`);continue}
   const actual=records.get(matches[0].relativePath);
   actual.legacyClassification=r.doctor_category||r.classification||r.label||clone(r);
   restored++;
  }
 }
 history=[];
 return `恢復 ${restored} 筆。${data.schemaVersion===2?'':'舊類別保留為 Legacy / Unmapped，不自動對應新分類。'}${errors.length?' 未套用：'+errors.join('；'):''}`;
}
function parseCsv(text) {
 const rows=[];let row=[],value='',quoted=false;
 text=text.replace(/^\uFEFF/,'');
 for(let i=0;i<text.length;i++){
  const c=text[i];
  if(c==='"'){if(quoted&&text[i+1]==='"'){value+='"';i++}else quoted=!quoted}
  else if(c===','&&!quoted){row.push(value);value=''}
  else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(value);rows.push(row);row=[];value=''}
  else value+=c;
 }
 if(quoted)throw new Error('CSV 引號未閉合');
 if(value||row.length){row.push(value);rows.push(row)}
 const headers=rows.shift()||[];
 if(!headers.includes('image_id')||!headers.includes('doctor_category'))throw new Error('CSV 匯入僅支援 V1 image_id / doctor_category；V2 請使用 JSON 恢復');
 return rows.filter(r=>r.some(Boolean)).map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]||''])));
}
async function importFile(file) {
 try{
  const text=await file.text(),data=/\.csv$/i.test(file.name)?parseCsv(text):JSON.parse(text);
  if(!files.length||loading){pendingImport=data;say('已讀取備份；請選取相同原始圖片資料夾，完成 SHA-256 驗證後恢復。');return}
  const result=restoreData(data);show();persist();say(result);
 }catch(error){say(`匯入失敗：${error.message}；目前進度保留。`)}
}
function svgElement(name,attributes={}) {
 const node=document.createElementNS(SVG_NS,name);
 for(const [key,value]of Object.entries(attributes))node.setAttribute(key,String(value));return node;
}
function renderBoxes(updateSelectors=true,syncClassification=true) {
 const r=current();el.overlay.replaceChildren();
 if(!r)return;
 for(const a of r.annotations){
  const selected=a.annotationId===selectedId;
  const rect=svgElement('rect',{x:a.xMin,y:a.yMin,width:a.xMax-a.xMin,height:a.yMax-a.yMin,fill:'transparent',stroke:selected?'#ffc14d':'#00e6ff','stroke-width':2/scale,'data-id':a.annotationId});
  el.overlay.append(rect);
  const label=svgElement('text',{x:a.xMin+4/scale,y:a.yMin+16/scale,fill:'#ffc14d','font-size':13/scale,'pointer-events':'none'});label.textContent=a.classCode;el.overlay.append(label);
  if(selected)for(const [handle,hx,hy]of [['nw',a.xMin,a.yMin],['ne',a.xMax,a.yMin],['sw',a.xMin,a.yMax],['se',a.xMax,a.yMax]]){
   el.overlay.append(svgElement('rect',{x:hx-5/scale,y:hy-5/scale,width:10/scale,height:10/scale,fill:'#ffc14d','data-id':a.annotationId,'data-handle':handle}));
  }
 }
 if(gesture?.kind==='draw'){
  const p=gesture.start,q=gesture.end;
  el.overlay.append(svgElement('rect',{x:Math.min(p.x,q.x),y:Math.min(p.y,q.y),width:Math.abs(p.x-q.x),height:Math.abs(p.y-q.y),fill:'transparent',stroke:'#ffc14d','stroke-width':2/scale}));
 }
 if(updateSelectors){
  el.boxes.replaceChildren(new Option(el.mode.value==='draw'?`新增標註框（目前 ${r.annotations.length} 個）`:`已標註 ${r.annotations.length} 個框 — 選取以編輯`,''),...r.annotations.map((a,i)=>new Option(`#${i+1} — ${a.classCode}`,a.annotationId)));
  el.boxes.value=selectedId||'';
  const a=r.annotations.find(a=>a.annotationId===selectedId);
  const drawing=el.mode.value==='draw',value=drawing?(a||draftClassification):r.imageClassification;
  if(syncClassification){el.parent.value=value?.parentCode||'';populateChildren(el.parent.value,el.child,value?.classCode||'')}
  el.boxPicker.classList.toggle('hidden',!drawing&&!r.annotations.length);el.deleteBox.classList.toggle('hidden',!drawing||!a);el.deleteBox.disabled=!a;
  el.newBox.classList.toggle('hidden',!drawing||!a);el.autoNextLabel.classList.toggle('hidden',drawing);el.drawHint.classList.toggle('hidden',!drawing);
  el.autoNext.disabled=drawing;
  el.classify.textContent=drawing&&!a?'請拖曳':'儲存';
  el.classify.setAttribute('aria-label',drawing?'儲存選取框分類':'儲存整張影像分類');
  el.classify.disabled=loading||!r.imageWidth||(drawing&&!a);
  el.startBox.innerHTML='<span aria-hidden="true">▣</span> '+(drawing?'結束框選':'框選');el.startBox.setAttribute('aria-pressed',String(drawing));
  el.targetHint.dataset.kind=drawing?'box':'image';
  const number=r.annotations.findIndex(box=>box.annotationId===selectedId)+1;
  el.targetHint.textContent=drawing?(a?`框 #${number}`:'新增框'):'整張影像';
  el.drawHint.textContent=a?`框 #${number} · ${a.classCode}`:`拖曳框選 · ${draftClassification?.classCode||'選擇分類'}`;
 }
}
function imagePoint(event) {
 // SVG getScreenCTM includes the CSS transform, browser zoom and viewport position.
 const matrix=el.overlay.getScreenCTM();if(!matrix)return null;
 const point=new DOMPoint(event.clientX,event.clientY).matrixTransform(matrix.inverse());
 const r=current();return {x:Math.max(0,Math.min(r.imageWidth,point.x)),y:Math.max(0,Math.min(r.imageHeight,point.y))};
}
function pointerDown(event) {
 if(loading||!current()?.imageWidth||current().loadError||event.button!==0)return;
 if(el.mode.value==='browse')gesture={kind:'pan',startX:event.clientX,startY:event.clientY,x,y};
 else{
  const point=imagePoint(event);if(!point)return;
  const target=event.target.closest('[data-id]');
  if(target){
   selectedId=target.dataset.id;
   const box=current().annotations.find(a=>a.annotationId===selectedId);
   gesture={kind:target.dataset.handle?'resize':'move',handle:target.dataset.handle,start:point,original:clone(box),before:clone(current()),changed:false};renderBoxes();
  }else{
   const value=classValue(el.parent.value,el.child.value)||current().imageClassification;
   if(!isClass(value)){say('請先選細胞／物件類別與形態分類，再新增框；每個框都必須有分類。');return}
   draftClassification=clone(value);selectedId=null;gesture={kind:'draw',start:point,end:point,value:clone(value)};renderBoxes();
  }
 }
 el.viewer.setPointerCapture(event.pointerId);event.preventDefault();
}
function pointerMove(event) {
 if(!gesture)return;
 if(gesture.kind==='pan'){x=gesture.x+event.clientX-gesture.startX;y=gesture.y+event.clientY-gesture.startY;fitMode=false;applyTransform();return}
 const point=imagePoint(event);if(!point)return;
 if(gesture.kind==='draw'){gesture.end=point;renderBoxes(false);return}
 const r=current(),a=r.annotations.find(a=>a.annotationId===selectedId),o=gesture.original;
 if(gesture.kind==='move'){
  const dx=Math.max(-o.xMin,Math.min(r.imageWidth-o.xMax,point.x-gesture.start.x));
  const dy=Math.max(-o.yMin,Math.min(r.imageHeight-o.yMax,point.y-gesture.start.y));
  Object.assign(a,{xMin:o.xMin+dx,yMin:o.yMin+dy,xMax:o.xMax+dx,yMax:o.yMax+dy});
 }else{
  if(gesture.handle.includes('w'))a.xMin=Math.min(point.x,a.xMax-1);
  if(gesture.handle.includes('e'))a.xMax=Math.max(point.x,a.xMin+1);
  if(gesture.handle.includes('n'))a.yMin=Math.min(point.y,a.yMax-1);
  if(gesture.handle.includes('s'))a.yMax=Math.max(point.y,a.yMin+1);
 }
 gesture.changed=true;renderBoxes(false);
}
function smallBox(a){return (a.xMax-a.xMin)<3||(a.yMax-a.yMin)<3}
function pointerEnd(event) {
 if(!gesture)return;
 const action=gesture;gesture=null;
 if(el.viewer.hasPointerCapture(event.pointerId))el.viewer.releasePointerCapture(event.pointerId);
 if(event.type==='pointercancel'){
  if(action.before)records.set(current().relativePath,action.before);renderBoxes();return;
 }
 if(action.kind==='draw'){
  const a={annotationId:globalThis.crypto?.randomUUID?.()||`box-${Date.now()}-${Math.random().toString(16).slice(2)}`,...action.value,
   xMin:Math.min(action.start.x,action.end.x),yMin:Math.min(action.start.y,action.end.y),xMax:Math.max(action.start.x,action.end.x),yMax:Math.max(action.start.y,action.end.y),
   reviewStatus:'unreviewed',annotator:el.reviewer.value.trim(),annotationTimestamp:new Date().toISOString()};
  if(a.xMax<=a.xMin||a.yMax<=a.yMin){say('框面積為零，未儲存；請重新拖曳。');renderBoxes();return}
  checkpoint();current().annotations.push(a);selectedId=a.annotationId;changed(true);
  say(smallBox(a)?'警告：框異常小，請放大檢查。':'已新增框；可拖移、拖角調整或修改此框分類。');
 }else if(action.before&&action.changed){
  history.push({index,path:current().relativePath,record:action.before});
  const a=current().annotations.find(a=>a.annotationId===selectedId);timestamp(a);changed();say(smallBox(a)?'警告：框異常小，請檢查。':'框已更新。');
 }
}
function deleteBox() {
 if(!selectedId)return;
 checkpoint();current().annotations=current().annotations.filter(a=>a.annotationId!==selectedId);selectedId=null;changed(true);say('已刪框。');
}
const CSV_COLUMNS=['schema_version','reviewer','batch_name','file_name','relative_path','sha256','image_width','image_height',
 'image_parent_code','image_parent_label','image_class_code','image_class_label','annotation_id',
 'object_parent_code','object_parent_label','object_class_code','object_class_label','x_min','y_min','x_max','y_max',
 'review_status','annotation_timestamp','notes','object_review_status','object_annotation_timestamp','legacy_classification','load_error','hash_error'];
function csvRows() {
 const rows=[CSV_COLUMNS];
 for(const r of records.values())for(const a of r.annotations.length?r.annotations:[null]){
  const image=r.imageClassification?classValue(r.imageClassification.parentCode,r.imageClassification.classCode):null;
  const object=a?classValue(a.parentCode,a.classCode):null;
  rows.push([2,r.annotator||el.reviewer.value.trim(),el.batch.value.trim(),r.fileName,r.relativePath,r.sha256,r.imageWidth||'',r.imageHeight||'',
   image?.parentCode||'',image?.parentLabel||'',image?.classCode||'',image?.classLabel||'',a?.annotationId||'',
   object?.parentCode||'',object?.parentLabel||'',object?.classCode||'',object?.classLabel||'',a?.xMin??'',a?.yMin??'',a?.xMax??'',a?.yMax??'',
   r.reviewStatus,r.annotationTimestamp,r.notes,a?.reviewStatus||'',a?.annotationTimestamp||'',
   r.legacyClassification?JSON.stringify(r.legacyClassification):'',r.loadError,r.hashError]);
 }
 return rows;
}
function csvString() {return '\uFEFF'+csvRows().map(row=>row.map(value=>'"'+String(value).replaceAll('"','""')+'"').join(',')).join('\r\n')}
function exportProblems() {
 const errors=[],ids=new Set();
 for(const r of records.values()){
  errors.push(...validateRecord(r).map(error=>`${r.relativePath}：${error}`));
  for(const a of r.annotations){if(ids.has(a.annotationId))errors.push(`annotationId 全資料集重複：${a.annotationId}`);ids.add(a.annotationId)}
 }
 return errors;
}
function download(content,type,extension) {
 const safeName=(el.reviewer.value.trim()||'reviewer').replace(/[^a-zA-Z0-9\u4e00-\u9fff_-]/g,'_');
 const url=URL.createObjectURL(new Blob([content],{type})),link=document.createElement('a');
 link.href=url;link.download=`MSH_醫師分類結果_${safeName}_${new Date().toISOString().replace(/[:.]/g,'-')}.${extension}`;
 document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function exportData(format) {
 if(loading||!files.length){say('請等待圖片與 SHA-256 載入完成。');return}
 const problems=exportProblems();if(problems.length){say('無法匯出：'+problems.join('；'));return}
 const tiny=[...records.values()].flatMap(r=>r.annotations.filter(smallBox));
 if(tiny.length&&!confirm(`有 ${tiny.length} 個異常小框（邊長小於 3 原圖像素）。仍要匯出？`))return;
 persist();
 if(format==='csv')download(csvString(),'text/csv;charset=utf-8','csv');
 else download(JSON.stringify(snapshot(),null,2),'application/json;charset=utf-8','json');
 const incomplete=[...records.values()].filter(r=>r.loadError||!r.sha256||r.legacyClassification||!r.imageClassification).length;
 say(`已下載 ${format.toUpperCase()}。${incomplete?`${incomplete} 張包含未分類、Legacy、載入／雜湊缺漏；欄位已標示，需複核。`:''}${unmatchedRecords.length?' 未套用記錄保存在 JSON 備份中。':''}`);
}
function keyboard(event) {
 if(event.target.matches('input,textarea,select'))return;
 const key=event.key.toUpperCase();
 if((event.ctrlKey||event.metaKey)&&key==='Z'){event.preventDefault();undo();return}
 if(event.ctrlKey||event.metaKey||event.altKey)return;
 if(key==='S'||key==='ARROWRIGHT'){navigate(1);return}
 if(key==='ARROWLEFT'){navigate(-1);return}
 if(key==='ENTER'){event.preventDefault();classify();return}
 if(key==='DELETE'&&el.mode.value==='draw'){event.preventDefault();deleteBox();return}
 if(key==='ESCAPE'){setReviewMode('browse');return}
 if(/^[1-8]$/.test(key)){
  const p=CLASSIFICATION.find(p=>p.code===el.parent.value),child=p?.children[Number(key)-1];
  if(child){el.child.value=child.code;classify()}else say('先選細胞／物件類別；1–8 選擇該類別的前八個形態分類並儲存。');
 }
 if(['M','N','U'].includes(key)&&current()){checkpoint();current().reviewStatus=key==='U'?'unreviewed':'reviewed';changed();say('已更新檢閱標記。')}
}
populateParents(el.parent);populateChildren('',el.child);
el.parent.addEventListener('change',()=>{populateChildren(el.parent.value,el.child);if(el.mode.value==='draw'&&!selectedId){draftClassification=null;renderBoxes(true,false)}});
el.child.addEventListener('change',()=>{if(el.mode.value==='draw'&&!selectedId){draftClassification=classValue(el.parent.value,el.child.value);renderBoxes(true,false)}});
el.classify.addEventListener('click',classify);
el.folder.addEventListener('click',()=>{el.folder.value=''});
el.folder.addEventListener('change',()=>{const picked=Array.from(el.folder.files);el.folder.value='';loadFiles(picked).catch(error=>{loading=false;updateProgress();say(`載入失敗：${error.message}`)})});
el.reviewer.addEventListener('input',()=>{updateProgress();schedulePersist()});
el.restore.addEventListener('change',()=>{const file=el.restore.files[0];el.restore.value='';if(file)importFile(file)});
el.previous.addEventListener('click',()=>navigate(-1));el.skip.addEventListener('click',()=>navigate(1));el.next.addEventListener('click',()=>navigate(1));el.undo.addEventListener('click',undo);
el.imageList.addEventListener('change',()=>{if(loading)return;el.mode.value='browse';el.viewer.classList.remove('drawing');index=Number(el.imageList.value);show();schedulePersist()});
el.zoomIn.addEventListener('click',()=>zoomAt(scale*1.25));el.zoomOut.addEventListener('click',()=>zoomAt(scale/1.25));el.fit.addEventListener('click',fitImage);el.original.addEventListener('click',originalImage);
el.viewer.addEventListener('wheel',e=>{if(!current()?.imageWidth)return;e.preventDefault();zoomAt(scale*(e.deltaY<0?1.18:1/1.18),e.clientX,e.clientY)},{passive:false});
el.viewer.addEventListener('pointerdown',pointerDown);el.viewer.addEventListener('pointermove',pointerMove);el.viewer.addEventListener('pointerup',pointerEnd);el.viewer.addEventListener('pointercancel',pointerEnd);
function setReviewMode(mode) {
 if(gesture?.before)records.set(current().relativePath,gesture.before);
 draftClassification=classValue(el.parent.value,el.child.value)||current()?.imageClassification||null;
 gesture=null;selectedId=null;el.mode.value=mode;
 el.viewer.classList.toggle('drawing',mode==='draw');renderBoxes();
}
function startBox() {
 if(loading||!current()?.imageWidth||current().loadError)return;
 const value=classValue(el.parent.value,el.child.value);
 if(!value){say('請先選擇分類。');el.parent.focus();return}
 setReviewMode('draw');draftClassification=value;renderBoxes();
 say(`拖曳框選 · ${value.classCode}`);
 el.viewer.scrollIntoView({block:'center'});
}
el.startBox.addEventListener('click',()=>{if(el.mode.value==='draw')setReviewMode('browse');else startBox()});
el.newBox.addEventListener('click',startBox);
el.boxes.addEventListener('change',()=>{if(el.boxes.value){el.mode.value='draw';el.viewer.classList.add('drawing')}selectedId=el.boxes.value||null;renderBoxes()});
el.deleteBox.addEventListener('click',deleteBox);
el.save.addEventListener('click',()=>exportData('csv'));el.saveJson.addEventListener('click',()=>exportData('json'));
document.addEventListener('keydown',keyboard);
let previousSize={width:el.viewer.clientWidth,height:el.viewer.clientHeight};
new ResizeObserver(()=>{
 const width=el.viewer.clientWidth,height=el.viewer.clientHeight;
 if(fitMode)fitImage();else{x+=(width-previousSize.width)/2;y+=(height-previousSize.height)/2;applyTransform()}
 previousSize={width,height};
}).observe(el.viewer);
window.addEventListener('beforeunload',()=>{clearTimeout(saveTimer);persist();releasePreview()});
updateProgress();

</script>
