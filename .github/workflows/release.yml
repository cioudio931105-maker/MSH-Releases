name: MSH installer delivery

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'candidate: validate without uploading binaries; prepare-release: reviewed stable build; publish: approve a prepared artifact'
        type: choice
        options: [candidate, prepare-release, publish]
        default: candidate
      evidence_ref:
        description: 'Ref containing a reviewed public-safe release/acceptance.json (prepare-release only)'
        default: main
        type: string
      build_run_id:
        description: 'Successful prepare-release run ID to publish (publish only)'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: msh-installer-delivery
  cancel-in-progress: false

jobs:
  resolve:
    if: inputs.operation != 'publish' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    outputs:
      version: ${{ steps.source.outputs.version }}
      commit: ${{ steps.source.outputs.commit }}
      candidate: ${{ steps.source.outputs.candidate }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.13'
      - name: Load reviewed public-safe acceptance summary
        if: inputs.operation == 'prepare-release'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.evidence_ref }}
          path: build/evidence-source
          persist-credentials: false
          sparse-checkout: release/acceptance.json
          sparse-checkout-cone-mode: false
      - id: source
        name: Verify exact source and release gates
        shell: pwsh
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          $arguments = @('preflight')
          if ($env:OPERATION -eq 'candidate') {
            $arguments += '--candidate'
          } else {
            Copy-Item -LiteralPath build/evidence-source/release/acceptance.json -Destination build/acceptance.json
            python scripts/ci_release.py public-record --record build/acceptance.json
            if ($LASTEXITCODE -ne 0) { throw 'Public acceptance summary rejected' }
            $arguments += @('--acceptance-record', 'build/acceptance.json')
          }
          $result = python scripts/release_pipeline.py @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Release preflight failed' }
          $source = $result | ConvertFrom-Json
          "version=$($source.version)" >> $env:GITHUB_OUTPUT
          "commit=$($source.source_commit)" >> $env:GITHUB_OUTPUT
          "candidate=$($source.mode -eq 'candidate')" >> $env:GITHUB_OUTPUT
      - if: inputs.operation == 'prepare-release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-acceptance
          path: build/acceptance.json
          retention-days: 7
          if-no-files-found: error

  package:
    needs: resolve
    runs-on: windows-2025
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        runtime: [cpu, gpu]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.13'
      - name: Install pinned build environment
        run: python -m pip install --no-cache-dir --disable-pip-version-check -r requirements-release-${{ matrix.runtime }}.txt
      - name: Software tests and source audit
        shell: pwsh
        env:
          YOLO_CONFIG_DIR: ${{ runner.temp }}/msh-test-config
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw 'Software tests failed' }
          python scripts/audit_application_files.py
          if ($LASTEXITCODE -ne 0) { throw 'Application-only source audit failed' }
      - name: Install verified build compiler
        run: python scripts/ci_release.py inno
      - if: inputs.operation == 'prepare-release'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-acceptance
          path: build
      - name: Build fresh standalone installer and frozen software report
        shell: pwsh
        env:
          RUNTIME: ${{ matrix.runtime }}
          CANDIDATE: ${{ needs.resolve.outputs.candidate }}
        run: |
          $arguments = @('package', '--runtime', $env:RUNTIME, '--python', (Get-Command python).Source)
          if ($env:CANDIDATE -eq 'True') { $arguments += '--candidate' }
          else { $arguments += @('--acceptance-record', 'build/acceptance.json') }
          python scripts/release_pipeline.py @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - if: inputs.operation == 'prepare-release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-${{ matrix.runtime }}
          path: dist/release/v${{ needs.resolve.outputs.version }}/MSH_Setup_*
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - if: inputs.operation == 'prepare-release' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-log-${{ matrix.runtime }}
          path: build/release-logs/*.log
          retention-days: 7
          if-no-files-found: ignore

  assemble:
    if: inputs.operation == 'prepare-release'
    needs: [resolve, package]
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: dist/release/v${{ needs.resolve.outputs.version }}
      - if: inputs.operation == 'prepare-release'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-acceptance
          path: build
      - name: Install verified build compiler
        run: python scripts/ci_release.py inno
      - name: Download pinned official Basler prerequisite without executing it
        env:
          MSH_PYLON_URL: ${{ vars.MSH_PYLON_URL }}
          MSH_PYLON_SHA256: ${{ vars.MSH_PYLON_SHA256 }}
        run: python scripts/ci_release.py pylon
      - name: Assemble exact delivery and inspect its public file list
        shell: pwsh
        env:
          CANDIDATE: ${{ needs.resolve.outputs.candidate }}
          MSH_PYLON_URL: ${{ vars.MSH_PYLON_URL }}
        run: |
          $arguments = @('assemble', '--notes', 'release/NOTES.md')
          if ($env:CANDIDATE -eq 'True') { $arguments += '--candidate' }
          else { $arguments += @('--acceptance-record', 'build/acceptance.json') }
          if (Test-Path -LiteralPath build/prerequisites/Basler_Runtime_Setup.exe) {
            $arguments += @('--pylon-installer', 'build/prerequisites/Basler_Runtime_Setup.exe', '--pylon-url', $env:MSH_PYLON_URL, '--pylon-license-reviewed')
          }
          python scripts/release_pipeline.py @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Delivery assembly failed' }
          $version = python -c "from msh_version import __version__; print(__version__)"
          $plan = "dist/delivery/v$version/release-plan.json"
          python scripts/publish_release.py $plan
          if ($LASTEXITCODE -ne 0) { throw 'Delivery verification failed' }
          $delivery = Get-Content -LiteralPath $plan -Raw | ConvertFrom-Json
          "### MSH $version reviewed delivery" >> $env:GITHUB_STEP_SUMMARY
          "Publishable: $($delivery.publishable). Source: $($delivery.source_commit)." >> $env:GITHUB_STEP_SUMMARY
          "| File | Bytes | SHA-256 |`n|---|---:|---|" >> $env:GITHUB_STEP_SUMMARY
          foreach ($asset in $delivery.assets) { "| $($asset.name) | $($asset.size_bytes) | $($asset.sha256) |" >> $env:GITHUB_STEP_SUMMARY }
          "Review the public msh-delivery artifact. To approve this stable delivery, run publish with build_run_id=$env:GITHUB_RUN_ID. Unreviewed candidate binaries are not uploaded." >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: msh-delivery
          path: dist/delivery/v${{ needs.resolve.outputs.version }}/*
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  publish:
    if: inputs.operation == 'publish' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.13'
      - name: Check the selected prepared run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREPARED_RUN: ${{ inputs.build_run_id }}
        run: python scripts/ci_release.py review-run --run-id "$env:PREPARED_RUN"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: msh-delivery
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: build/reviewed-delivery
      - name: Verify prepared source, files and acceptance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREPARED_RUN: ${{ inputs.build_run_id }}
        run: python scripts/ci_release.py verify-run --run-id "$env:PREPARED_RUN" --plan build/reviewed-delivery/release-plan.json
      - name: Publish verified assets, then update main/latest.json last
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py build/reviewed-delivery/release-plan.json --publish
